<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <!-- dat.GUI for controls (Leva is React-first, dat.GUI is standard for p5.js) -->
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
  </head>

  <body>
    <!-- Connection UI (shown initially) -->
    <div id="connection-ui" class="playdate-overlay connection-ui">
      <div class="connection-content">
        <div class="connection-title">Connect Your Playdate</div>
        <div class="connection-instruction">Drag the mouse to generate new boids.</div>
        <button id="connect-button" class="playdate-button">Connect Playdate</button>
      </div>
    </div>
    
    <!-- Stage UI Overlays -->
    <div id="stage-overlay" class="playdate-overlay" style="display: none;">
      <div id="stage-content"></div>
    </div>
    <div id="progress-overlay" class="playdate-overlay progress-container" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill"></div>
        <div class="progress-text">Hold A to confirm...</div>
      </div>
    </div>
    
    <!-- Load modules in order: settings, then dependencies, then stages, then main sketch -->
    <script src="settings.js"></script>
    <script src="boids.js"></script>
    <script src="playdate.js"></script>
    <script src="controls.js"></script>
    <script src="stage1.js"></script>
    <script src="stage2.js"></script>
    <script src="stage3.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
